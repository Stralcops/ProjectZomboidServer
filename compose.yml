services:
  panel:
    image: ghcr.io/pelican/panel:latest
    restart: unless-stopped
    networks:
      - pelican
    # Local (BEHIND_PROXY=true) : Caddy écoute sur 80 pour tout nom d'hôte, mappé sur PANEL_HTTP_PORT (8081).
    # OVH (BEHIND_PROXY=false) : Caddy écoute sur 80 et 443 pour le domaine de APP_URL et gère Let's Encrypt.
    ports:
      - "${PANEL_HTTP_PORT:-80}:80"
      - "${PANEL_HTTPS_PORT:-443}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pelican-data:/pelican-data
      - pelican-logs:/var/www/html/storage/logs
    environment:
      XDG_DATA_HOME: /pelican-data
      APP_URL: "${APP_URL}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      LE_EMAIL: "${ADMIN_EMAIL}"
      BEHIND_PROXY: "${BEHIND_PROXY:-false}"
      TZ: "${TZ}"

  wings:
    image: ghcr.io/pelican/wings:latest
    restart: unless-stopped
    networks:
      pelican:
        aliases:
          - wings
    ports:
      - "8080:8080"
      - "2022:2022"
    tty: true
    environment:
      TZ: "${TZ}"
      WINGS_UID: 988
      WINGS_GID: 988
      WINGS_USERNAME: pelican
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/lib/docker/containers/:/var/lib/docker/containers/"
      - "/etc/pelican/:/etc/pelican/"
      - "/var/lib/pelican/:/var/lib/pelican/"
      - "/var/log/pelican/:/var/log/pelican/"
      - "/tmp/pelican/:/tmp/pelican/"
      - "/etc/ssl/certs:/etc/ssl/certs:ro"

volumes:
  pelican-data:
  pelican-logs:

networks:
  pelican:
    name: pelican
    ipam:
      config:
        - subnet: 172.20.0.0/16
